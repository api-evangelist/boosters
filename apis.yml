aid: boosters
name: Boosters
description: >-
  Boosters is a Seoul-based global commerce company and brand aggregator, founded in 2019, that
  acquires and accelerates the growth of emerging Korean direct-to-consumer (D2C) brands, with a
  particular focus on K-Beauty. Boosters takes over small and medium-sized Korean brands that have
  strong product potential but struggle with marketing, distribution, and inventory management, then
  scales them across domestic and international commerce channels. Portfolio brands include Eqqualberry
  and Branden. The company raised a USD 10 million Series A round in 2022 with participation from
  Partech and other investors. Boosters is a consumer commerce operator rather than a developer platform,
  and does not currently publish a public developer API, OpenAPI specification, SDK, or developer portal.
